name: Собери APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-build
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Забираю репозиторий
        uses: actions/checkout@v5

      - name: Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Android SDK (уже встроен в сервер GitHub)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Ставлю Capacitor
        run: npm install

      - name: Создаю Android-проект
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android

      - name: Собираю APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Красивое имя файла
        run: cp android/app/build/outputs/apk/debug/app-debug.apk mirohod-${{ github.run_number }}.apk

      - name: Кладу в артефакты
        uses: actions/upload-artifact@v4
        with:
          name: mirohod-apk
          path: mirohod-${{ github.run_number }}.apk

      - name: Выкладываю в Releases (удобно качать с телефона)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Мироход · сборка ${{ github.run_number }}
          files: mirohod-${{ github.run_number }}.apk
